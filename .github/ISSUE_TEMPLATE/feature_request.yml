name: Feature request
description: A component, variant or prop you are missing.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you building?
      description: The problem first. What did you reach for, and where did the current components fall short?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
      description: The API or behavior you have in mind. A screenshot of the interface helps more than a list of props.
  - type: checkboxes
    id: build
    attributes:
      label: Contributing
      options:
        - label: I would like to build this myself once we agree on the shape.
